services:
    - type: web
      name: edcm-app
      runtime: python
      pythonVersion: 3.10
      buildCommand: |
          pip install -r requirements.txt
          cd frontend && npm install && npm run build && cd ..
          python manage.py collectstatic --noinput
      startCommand: python manage.py migrate && python manage.py seed_data && gunicorn --bind 0.0.0.0:${PORT:-8000} --workers 3 config.wsgi:application
      # Environment variables
      envVars:
          - key: PYTHON_VERSION
            value: 3.10
          - key: SECRET_KEY
            fromQuery: SECRET_KEY
          - key: DEBUG
            value: "False"
          - key: ALLOWED_HOSTS
            value: "localhost,127.0.0.1,edcm-app,.onrender.com"
          - key: DATABASE_URL
            fromDatabase:
                name: edcm-postgres
                property: connectionString
          - key: CORS_ALLOWED_ORIGINS
            value: "https://client-portal-frontend.onrender.com,https://edcm-app.onrender.com"
          - key: SECURE_SSL_REDIRECT
            value: "True"
          - key: SESSION_COOKIE_SECURE
            value: "True"
          - key: CSRF_COOKIE_SECURE
            value: "True"
          - key: SEED_DATA
            value: "True"
          - key: DB_SSL_REQUIRE
            value: "True"

      # Disk configuration
      disk:
          name: edcm-disk
          mountPath: /var/data
          sizeGB: 1

      # Health check
      healthCheckPath: /api/health/

      # Auto-deploy on push
      autoDeployOnPush: true

    - type: web
      name: client-portal
      runtime: docker
      dockerContext: client_portal/backend
      dockerfilePath: client_portal/backend/Dockerfile
      envVars:
          - key: PORTAL_DB_PATH
            value: /var/data/portal.db
          - key: EDCM_BACKEND_URL
            value: http://edcm-app:10000/api
          - key: SECRET_KEY
            fromQuery: SECRET_KEY
          - key: GOOGLE_CLIENT_ID
            fromQuery: GOOGLE_CLIENT_ID
          - key: GOOGLE_CLIENT_SECRET
            fromQuery: GOOGLE_CLIENT_SECRET
          - key: GOOGLE_REDIRECT_URI
            value: https://client-portal-frontend.onrender.com/google-callback
      disk:
          name: client-portal-disk
          mountPath: /var/data
          sizeGB: 1

    - type: web
      name: client-portal-frontend
      runtime: docker
      dockerContext: client_portal/frontend
      dockerfilePath: client_portal/frontend/Dockerfile

databases:
    - name: edcm-postgres
      databaseName: edcm_db
      user: postgres
      plan: free
      postgresMajorVersion: 15
