name: EDCM AWS CI/CD

on:
  push:
    branches: [ main,develop]

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: edcm
  
jobs:
  build:
    runs-on: ubuntu-latest
     
    steps:
      - uses: actions/checkout@v4
      - name: Build the Container 
        run: docker build -t  ${{ env.ECR_REPOSITORY }}:latest .
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Tag, and Push image to Amazon ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ env.ECR_REPOSITORY }}
        run: |
          docker tag $REPOSITORY:latest $REGISTRY/$REPOSITORY:${{ github.sha }}
          docker tag $REPOSITORY:latest $REGISTRY/$REPOSITORY:latest
          docker push $REGISTRY/$REPOSITORY:${{ github.sha }}
          docker push $REGISTRY/$REPOSITORY:latest
  deploy:
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: staging
    
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Trigger App Runner Deployment
        run: |
          aws apprunner start-deployment --service-arn ${{ secrets.AWS_SERVICE_ARN }}
          
